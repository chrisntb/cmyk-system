---
- name: Setup - Local Path Provisioner
  hosts: cluster_controller
  become: false
  vars:
    # https://github.com/rancher/local-path-provisioner/releases
    local_path_provisioner_version: "0.0.35"
  tasks:
    - name: Get regular user's home directory
      ansible.builtin.command:
        cmd: echo $HOME
      register: user_home
      changed_when: false

    - name: Check if Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Fail if cluster is not reachable
      ansible.builtin.fail:
        msg: "Cannot proceed without a running Kubernetes cluster"
      when: cluster_check.rc != 0

    - name: Install local-path-provisioner
      ansible.builtin.command:
        cmd: >
          kubectl apply -f
          https://raw.githubusercontent.com/rancher/local-path-provisioner/v{{ local_path_provisioner_version }}/deploy/local-path-storage.yaml
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: lpp_result
      changed_when: "'configured' in lpp_result.stdout or 'created' in lpp_result.stdout"

    - name: Set local-path as default StorageClass
      ansible.builtin.command:
        cmd: >
          kubectl patch storageclass local-path
          -p '{"metadata": {"annotations": {"storageclass.kubernetes.io/is-default-class": "true"}}}'
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: patch_result
      changed_when: "'patched' in patch_result.stdout"

    - name: Verify StorageClass
      ansible.builtin.command:
        cmd: kubectl get storageclass
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: sc_result
      changed_when: false

    - name: Display StorageClass
      ansible.builtin.debug:
        var: sc_result.stdout_lines
