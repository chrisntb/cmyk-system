---
- name: Setup - Nvidia GPU Operator
  hosts: cluster_controller
  become: false
  vars:
    # https://github.com/NVIDIA/gpu-operator/releases
    gpu_operator_version: "v25.10.1"
    gpu_operator_chart: "nvidia/gpu-operator"
    gpu_operator_namespace: "gpu-operator"
    gpu_operator_name: "nvidia-gpu-operator"

    use_proxy: ""
    _proxy_enabled: "{{ use_proxy | string | lower == 'yes' }}"

    http_proxy: ""
    https_proxy: "{{ http_proxy }}"
    pod_network_cidr: ""
    service_cidr: ""
    node_ips: ""
    no_proxy: "localhost,127.0.0.1,.svc,.cluster.local,{{ pod_network_cidr }},{{ service_cidr }},{{ node_ips }}"

    gpu_operator_values_file: "/tmp/nvidia-gpu-operator-values.yaml"
    gpu_operator_values_arg: "{{ '-f ' + gpu_operator_values_file if _proxy_enabled else '' }}"
  tasks:
    - name: Assert use_proxy is provided and valid
      ansible.builtin.assert:
        that:
          - use_proxy | string | lower in ['yes', 'no']
        fail_msg: "use_proxy must be passed in as 'yes' or 'no'"

    - name: Assert required proxy variables are set
      ansible.builtin.assert:
        that:
          - http_proxy | length > 0
          - pod_network_cidr | length > 0
          - service_cidr | length > 0
          - node_ips | length > 0
        fail_msg: "Required variables must be passed in: http_proxy, pod_network_cidr, service_cidr, node_ips"
      when: _proxy_enabled

    - name: Get regular user's home directory
      ansible.builtin.command:
        cmd: echo $HOME
      register: user_home
      changed_when: false

    - name: Check if Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Display message if cluster is not reachable
      ansible.builtin.debug:
        msg: "Kubernetes cluster is not initialized or reachable. Please initialize the cluster before running this playbook."
      when: cluster_check.rc != 0

    - name: Fail if cluster is not reachable
      ansible.builtin.fail:
        msg: "Cannot proceed without a running Kubernetes cluster"
      when: cluster_check.rc != 0

    - name: Create Nvidia GPU Operator values file
      ansible.builtin.copy:
        dest: "{{ gpu_operator_values_file }}"
        content: |
          driver:
            env:
              - name: http_proxy
                value: {{ http_proxy }}
              - name: https_proxy
                value: {{ https_proxy }}
              - name: no_proxy
                value: {{ no_proxy }}
        mode: '0644'
      when: _proxy_enabled

    - name: Install Nvidia GPU Operator using Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install {{ gpu_operator_name }} {{ gpu_operator_chart }}
          --version {{ gpu_operator_version }}
          --namespace {{ gpu_operator_namespace }}
          --create-namespace
          --kubeconfig {{ user_home.stdout }}/.kube/config
          --set "daemonsets.tolerations[0].key=cmyk.io/compute-only"
          --set-string "daemonsets.tolerations[0].value=true"
          --set "daemonsets.tolerations[0].effect=NoSchedule"
          --set "node-feature-discovery.worker.tolerations[0].key=cmyk.io/compute-only"
          --set-string "node-feature-discovery.worker.tolerations[0].value=true"
          --set "node-feature-discovery.worker.tolerations[0].effect=NoSchedule"
          {{ gpu_operator_values_arg }}
      register: helm_install_result
      changed_when: "'STATUS: deployed' in helm_install_result.stdout"

    - name: Display installation result
      ansible.builtin.debug:
        var: helm_install_result.stdout_lines

    - name: Apply ClusterPolicy with compute node tolerations
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl apply --server-side --force-conflicts -f - <<'EOF'
          apiVersion: nvidia.com/v1
          kind: ClusterPolicy
          metadata:
            name: gpu-cluster-policy
          spec:
            daemonsets:
              tolerations:
                - key: cmyk.io/compute-only
                  value: "true"
                  effect: NoSchedule
            operator:
              defaultRuntime: crio
            driver:
              enabled: true
            toolkit:
              enabled: true
            devicePlugin:
              enabled: true
            dcgm:
              enabled: true
            dcgmExporter:
              enabled: true
            gfd:
              enabled: true
            nodeStatusExporter:
              enabled: true
          EOF
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: clusterpolicy_result
      changed_when: "'configured' in clusterpolicy_result.stdout or 'created' in clusterpolicy_result.stdout"

    - name: Wait for NFD worker to be ready on all nodes
      ansible.builtin.command:
        cmd: kubectl rollout status daemonset/nvidia-gpu-operator-node-feature-discovery-worker -n {{ gpu_operator_namespace }} --timeout=120s
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: nfd_rollout
      changed_when: false

    - name: Display NFD worker rollout status
      ansible.builtin.debug:
        var: nfd_rollout.stdout_lines

    - name: Get ClusterPolicy state
      ansible.builtin.command:
        cmd: kubectl get clusterpolicy gpu-cluster-policy -o jsonpath='{.status.state}'
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: clusterpolicy_state
      changed_when: false

    - name: Display ClusterPolicy state
      ansible.builtin.debug:
        msg: >-
          ClusterPolicy state: {{ clusterpolicy_state.stdout }}.
          GPU driver installation can take 10-20 minutes on first run.
          Monitor with: kubectl get pods -n gpu-operator -o wide
          Verify GPUs with: ansible-playbook checks/05_k8s-nodes_gpus_plays.yaml

    - name: Check Nvidia GPU Operator deployment status
      ansible.builtin.command:
        cmd: helm status {{ gpu_operator_name }} --namespace {{ gpu_operator_namespace }} --kubeconfig {{ user_home.stdout }}/.kube/config
      register: helm_status
      changed_when: false

    - name: Display Nvidia GPU Operator status
      ansible.builtin.debug:
        var: helm_status.stdout_lines
