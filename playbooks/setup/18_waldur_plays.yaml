---
- name: Setup - Waldur
  hosts: cluster_controller
  become: false
  vars:
    # https://github.com/waldur/waldur-helm/tags
    waldur_helm_repository_name: "waldur-charts"
    # waldur_helm_repository_url: "https://waldur.github.io/waldur-helm"
    waldur_helm_repository_url: "https://chrisntb.github.io/waldur-helm"
    waldur_helm_chart: "waldur-charts/waldur"
    waldur_helm_chart_version: "8.0.6"
    waldur_namespace: "waldur-system"
    waldur_alias: "waldur"
    waldur_values_local: "{{ playbook_dir }}/waldur-values.yaml"
    waldur_values_file: "/tmp/waldur-values.yaml"

    http_proxy: ""
    https_proxy: "{{ http_proxy }}"
    pod_network_cidr: ""
    service_cidr: ""
    node_ips: ""
    no_proxy: "localhost,127.0.0.1,.svc,.cluster.local,{{ pod_network_cidr }},{{ service_cidr }},{{ node_ips }}"
  tasks:
    - name: Assert required proxy variables are set
      ansible.builtin.assert:
        that:
          - http_proxy | length > 0
          - pod_network_cidr | length > 0
          - service_cidr | length > 0
          - node_ips | length > 0
        fail_msg: "Required variables must be passed in: http_proxy, pod_network_cidr, service_cidr, node_ips"

    - name: Get regular user's home directory
      ansible.builtin.command:
        cmd: echo $HOME
      register: user_home
      changed_when: false

    - name: Check if Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Display message if cluster is not reachable
      ansible.builtin.debug:
        msg: "Kubernetes cluster is not initialized or reachable. Please initialize the cluster before running this playbook."
      when: cluster_check.rc != 0

    - name: Fail if cluster is not reachable
      ansible.builtin.fail:
        msg: "Cannot proceed without a running Kubernetes cluster"
      when: cluster_check.rc != 0

    - name: Copy Waldur values file to controller
      ansible.builtin.copy:
        src: "{{ waldur_values_local }}"
        dest: "{{ waldur_values_file }}"
        mode: '0644'

    - name: Append proxy settings to Waldur values file
      ansible.builtin.blockinfile:
        path: "{{ waldur_values_file }}"
        block: |
          proxy:
            httpProxy: "{{ http_proxy }}"
            httpsProxy: "{{ https_proxy }}"
            noProxy: "{{ no_proxy }}"

    - name: Add Waldur Helm repository
      ansible.builtin.command:
        cmd: helm repo add --force-update {{ waldur_helm_repository_name }} {{ waldur_helm_repository_url }}
      register: waldur_repo_result
      changed_when: "'has been added' in waldur_repo_result.stdout"
      failed_when:
        - waldur_repo_result.rc != 0

    - name: Install Waldur using Helm
      ansible.builtin.command:
        cmd: >
          helm upgrade --install {{ waldur_alias }} {{ waldur_helm_chart }}
          -f {{ waldur_values_file }}
          --version {{ waldur_helm_chart_version }}
          --namespace {{ waldur_namespace }}
          --create-namespace
          --timeout 15m
          --kubeconfig {{ user_home.stdout }}/.kube/config
      register: helm_install_result
      changed_when: "'STATUS: deployed' in helm_install_result.stdout"
      failed_when:
        - helm_install_result.rc != 0

    - name: Display installation result
      ansible.builtin.debug:
        var: helm_install_result.stdout_lines

    - name: Check Waldur deployment status
      ansible.builtin.command:
        cmd: helm status {{ waldur_alias }} --namespace {{ waldur_namespace }} --kubeconfig {{ user_home.stdout }}/.kube/config
      register: helm_status
      changed_when: false

    - name: Display Waldur status
      ansible.builtin.debug:
        var: helm_status.stdout_lines
