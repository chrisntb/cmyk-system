---
- name: Job - Simple Shell Create
  hosts: cluster_controller
  become: false
  vars:
    pod_name: ""
  tasks:
    - name: Assert required variables are set
      ansible.builtin.assert:
        that:
          - pod_name | length > 0
        fail_msg: "Required variables must be passed in: pod_name"

    - name: Create Pod {{ pod_name }}
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl create -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            generateName: {{ pod_name }}-
          spec:
            restartPolicy: Never
            containers:
            - name: {{ pod_name }}
              image: nvidia/cuda:13.0.2-base-ubuntu22.04
              envFrom:
                - configMapRef:
                    name: test-environment
              command: ["/bin/sh", "-c"]
              args:
              - |
                set -e

                echo
                echo "-------- Printing environment --------"
                env
                echo "-"
                echo
              resources:
                limits:
                  cpu: 1
          EOF
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: kubectl_result
      changed_when: "'created' in kubectl_result.stdout"

    - name: Resolve actual pod name for {{ pod_name }}
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl get pods --no-headers \
            -o custom-columns=':metadata.name' \
            --sort-by=.metadata.creationTimestamp \
            | grep "^{{ pod_name }}-" | tail -1
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: resolved_pod
      changed_when: false

    - name: Set actual_pod_name
      ansible.builtin.set_fact:
        actual_pod_name: "{{ resolved_pod.stdout }}"

    - name: Describe pod {{ actual_pod_name }}
      ansible.builtin.command:
        cmd: kubectl describe pod {{ actual_pod_name }}
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: describe_output
      changed_when: false

    - name: Print pod description
      ansible.builtin.debug:
        msg: "{{ describe_output.stdout_lines }}"
