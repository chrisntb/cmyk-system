---
- name: Job - Simple CPU Display
  hosts: cluster_controller
  become: false
  vars:
    pod_name: ""
  tasks:
    - name: Assert required variables are set
      ansible.builtin.assert:
        that:
          - pod_name | length > 0
        fail_msg: "Required variables must be passed in: pod_name"

    - name: Get all pods across all namespaces
      ansible.builtin.command:
        cmd: kubectl get pods --all-namespaces
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: pods_output
      changed_when: false

    - name: Display pods
      ansible.builtin.debug:
        var: pods_output.stdout_lines

    - name: Resolve actual pod name for {{ pod_name }}
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl get pods --no-headers \
            -o custom-columns=':metadata.name' \
            --sort-by=.metadata.creationTimestamp \
            | grep "^{{ pod_name }}" | tail -1
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: resolved_job
      changed_when: false

    - name: Set actual_job_name
      ansible.builtin.set_fact:
        actual_job_name: "{{ resolved_job.stdout | trim }}"

    - name: Describe pod {{ actual_job_name }}
      ansible.builtin.command:
        cmd: kubectl describe pod {{ actual_job_name }}
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: describe_output
      changed_when: false

    - name: Print pod description
      ansible.builtin.debug:
        msg: "{{ describe_output.stdout_lines }}"

    - name: Set resource kind
      ansible.builtin.set_fact:
        resource_kind: pod

    - name: Run action menu
      ansible.builtin.include_tasks: ../../tasks/display_menu.yaml
