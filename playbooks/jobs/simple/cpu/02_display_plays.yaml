---
- name: Job - CPU Display
  hosts: cluster_controller
  become: false
  tasks:
    - name: Get all pods across all namespaces
      ansible.builtin.command:
        cmd: kubectl get pods --all-namespaces
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: pods_output
      changed_when: false

    - name: Display pods
      ansible.builtin.debug:
        var: pods_output.stdout_lines

    - name: Describe test-cpu-python pod
      ansible.builtin.command:
        cmd: kubectl describe pod test-cpu-python
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: describe_output
      changed_when: false

    - name: Print pod description
      ansible.builtin.debug:
        msg: "{{ describe_output.stdout_lines }}"

    - name: Get test-cpu-python logs
      ansible.builtin.command:
        cmd: kubectl logs test-cpu-python
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      register: logs_output
      changed_when: false

    - name: Print pod logs
      ansible.builtin.debug:
        msg: "{{ logs_output.stdout_lines }}"

    - name: Prompt to delete test-cpu-python pod
      ansible.builtin.pause:
        prompt: "Delete pod 'test-cpu-python'? [yes/no]"
      register: delete_prompt

    - name: Delete test-cpu-python pod
      ansible.builtin.command:
        cmd: kubectl delete pod test-cpu-python
      environment:
        KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
      changed_when: true
      when: delete_prompt.user_input | lower == 'yes'
