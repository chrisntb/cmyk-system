---
- name: Prompt for action
  ansible.builtin.pause:
    prompt: |
      Choose an action:
        logs (l)   - Show logs
        delete (d) - Delete
        quit (q)   - Exit
  register: _action_input
  until: _action_input.user_input | lower in ['logs', 'l', 'delete', 'd', 'quit', 'q']
  retries: 5
  delay: 0

- name: Get logs {{ actual_job_name }}
  ansible.builtin.command:
    cmd: kubectl logs {{ resource_kind }}/{{ actual_job_name }}
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  register: _logs_again
  changed_when: false
  when: _action_input.user_input | lower in ['logs', 'l']

- name: Print logs
  ansible.builtin.debug:
    msg: "{{ _logs_again.stdout_lines }}"
  when: _action_input.user_input | lower in ['logs', 'l']

- name: Delete {{ resource_kind }} {{ actual_job_name }}
  ansible.builtin.command:
    cmd: kubectl delete {{ resource_kind }} {{ actual_job_name }}
  environment:
    KUBECONFIG: "{{ ansible_env.HOME }}/.kube/config"
  changed_when: true
  when: _action_input.user_input | lower in ['delete', 'd']

- name: Return to action menu
  ansible.builtin.include_tasks: display_menu.yaml
  when: _action_input.user_input | lower in ['logs', 'l']
