---
- name: Setup - Container Runtime - CRI-O
  hosts: cluster
  become: true
  gather_facts: true
  vars:
    # https://github.com/cri-o/cri-o/releases
    # -> Latest patch will be used
    crio_version: "1.34"
    # https://github.com/kubernetes-sigs/cri-tools/releases
    critools_version: "1.35.0"
    os_version: "xUbuntu_24.04"
  tasks:
    - name: Set architecture to arm64
      ansible.builtin.set_fact:
        crictl_arch: "linux-arm64"
      when: ansible_facts['architecture'] == 'aarch64'

    - name: Set architecture to amd64
      ansible.builtin.set_fact:
        crictl_arch: "linux-amd64"
      when: ansible_facts['architecture'] != 'aarch64'

    - name: Add CRI-O apt repository key
      vars:
        crio_repo_base: "https://download.opensuse.org/repositories"
        crio_repo_path: "isv:/cri-o:/stable:/v{{ crio_version }}/deb"
      ansible.builtin.apt_key:
        url: "{{ crio_repo_base }}/{{ crio_repo_path }}/Release.key"
        keyring: /etc/apt/keyrings/cri-o-apt-keyring.gpg
        state: present

    - name: Add CRI-O apt repository
      vars:
        crio_repo_base: "https://download.opensuse.org/repositories"
        crio_repo_path: "isv:/cri-o:/stable:/v{{ crio_version }}/deb"
        crio_keyring: "/etc/apt/keyrings/cri-o-apt-keyring.gpg"
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ crio_keyring }}] {{ crio_repo_base }}/{{ crio_repo_path }}/ /"
        filename: cri-o
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install CRI-O
      ansible.builtin.apt:
        name:
          - cri-o
        state: present

    - name: Hold cri-o packages at current version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - cri-o

    - name: Enable CRI-O service
      ansible.builtin.systemd:
        name: crio
        enabled: true
        state: started

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify CRI-O is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['crio.service'].state == 'running'
        fail_msg: "CRI-O service is not running"

    - name: Download crictl
      vars:
        crictl_base_url: "https://github.com/kubernetes-sigs/cri-tools/releases/download"
        crictl_filename: "crictl-v{{ critools_version }}-{{ crictl_arch }}.tar.gz"
      ansible.builtin.get_url:
        url: "{{ crictl_base_url }}/v{{ critools_version }}/{{ crictl_filename }}"
        dest: "/tmp/{{ crictl_filename }}"
        mode: '0644'

    - name: Extract crictl to /usr/local/bin
      vars:
        crictl_filename: "crictl-v{{ critools_version }}-{{ crictl_arch }}.tar.gz"
      ansible.builtin.unarchive:
        src: "/tmp/{{ crictl_filename }}"
        dest: /usr/local/bin
        remote_src: true

    - name: Remove crictl archive
      vars:
        crictl_filename: "crictl-v{{ critools_version }}-{{ crictl_arch }}.tar.gz"
      ansible.builtin.file:
        path: "/tmp/{{ crictl_filename }}"
        state: absent
