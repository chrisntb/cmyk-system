---
- name: Setup - Helm Repositories
  hosts: cluster_controller
  become: false
  tasks:
    - name: Add NVIDIA Helm repository
      ansible.builtin.command:
        cmd: helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
      register: nvidia_repo_result
      changed_when: "'has been added' in nvidia_repo_result.stdout"
      failed_when:
        - nvidia_repo_result.rc != 0
        - "'already exists' not in nvidia_repo_result.stderr"

    - name: Add Prometheus Community Helm repository
      ansible.builtin.command:
        cmd: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: prometheus_repo_result
      changed_when: "'has been added' in prometheus_repo_result.stdout"
      failed_when:
        - prometheus_repo_result.rc != 0
        - "'already exists' not in prometheus_repo_result.stderr"

    - name: Update Helm repositories
      ansible.builtin.command:
        cmd: helm repo update
      changed_when: false

    - name: List Helm repositories
      ansible.builtin.command:
        cmd: helm repo list
      register: helm_repo_list
      changed_when: false

    - name: Display Helm repositories
      ansible.builtin.debug:
        var: helm_repo_list.stdout_lines
