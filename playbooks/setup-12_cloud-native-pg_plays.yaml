---
- name: Setup - CloudNativePG
  hosts: cluster_controller
  become: false
  vars:
    # https://github.com/cloudnative-pg/charts/releases
    cnpg_version: "0.27.1"
    cnpg_chart: "cloudnative-pg/cloudnative-pg"
    cnpg_namespace: "cnpg-system"
    cnpg_name: "cloudnative-pg"
  tasks:
    - name: Get regular user's home directory
      ansible.builtin.command:
        cmd: echo $HOME
      register: user_home
      changed_when: false

    - name: Check if Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      environment:
        KUBECONFIG: "{{ user_home.stdout }}/.kube/config"
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Display message if cluster is not reachable
      ansible.builtin.debug:
        msg: "Kubernetes cluster is not initialized or reachable. Please initialize the cluster before running this playbook."
      when: cluster_check.rc != 0

    - name: Fail if cluster is not reachable
      ansible.builtin.fail:
        msg: "Cannot proceed without a running Kubernetes cluster"
      when: cluster_check.rc != 0

    - name: Install CloudNativePG Operator using Helm
      ansible.builtin.command:
        cmd: >
          helm install {{ cnpg_name }} {{ cnpg_chart }}
          --version {{ cnpg_version }}
          --namespace {{ cnpg_namespace }}
          --create-namespace
          --kubeconfig {{ user_home.stdout }}/.kube/config
      register: helm_install_result
      changed_when: "'STATUS: deployed' in helm_install_result.stdout"
      failed_when:
        - helm_install_result.rc != 0
        - "'already exists' not in helm_install_result.stderr"

    - name: Display installation result
      ansible.builtin.debug:
        var: helm_install_result.stdout_lines

    - name: Check CloudNativePG Operator deployment status
      ansible.builtin.command:
        cmd: helm status {{ cnpg_name }} --namespace {{ cnpg_namespace }} --kubeconfig {{ user_home.stdout }}/.kube/config
      register: helm_status
      changed_when: false

    - name: Display CloudNativePG Operator status
      ansible.builtin.debug:
        var: helm_status.stdout_lines
