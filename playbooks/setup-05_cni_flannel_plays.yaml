---
- name: Setup - Container Network Interface (CNI) - Flannel
  hosts: cluster_controller
  become: false
  vars:
    # https://github.com/flannel-io/flannel/releases
    flannel_version: "0.28.0"
  tasks:
    - name: Check if Kubernetes cluster is reachable
      ansible.builtin.command:
        cmd: kubectl cluster-info
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Display message if cluster is not reachable
      ansible.builtin.debug:
        msg: "Kubernetes cluster is not initialized or reachable. Please initialize the cluster before running this playbook."
      when: cluster_check.rc != 0

    - name: Fail if cluster is not reachable
      ansible.builtin.fail:
        msg: "Cannot proceed without a running Kubernetes cluster"
      when: cluster_check.rc != 0

    - name: Check if Flannel is already installed
      ansible.builtin.command:
        cmd: kubectl get daemonset -n kube-flannel kube-flannel-ds
      register: flannel_check
      failed_when: false
      changed_when: false

    - name: Download Flannel manifest
      ansible.builtin.get_url:
        url: "https://github.com/flannel-io/flannel/releases/download/v{{ flannel_version }}/kube-flannel.yml"
        dest: "/tmp/kube-flannel-{{ flannel_version }}.yml"
        mode: '0644'
      when: flannel_check.rc != 0

    - name: Apply Flannel CNI
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/kube-flannel-{{ flannel_version }}.yml
      changed_when: true
      when: flannel_check.rc != 0
      register: flannel_apply

    - name: Display Flannel installation result
      ansible.builtin.debug:
        var: flannel_apply.stdout_lines
      when: flannel_check.rc != 0

    - name: Remove Flannel manifest
      ansible.builtin.file:
        path: "/tmp/kube-flannel-{{ flannel_version }}.yml"
        state: absent
      when: flannel_check.rc != 0

    - name: Display Flannel already installed message
      ansible.builtin.debug:
        msg: "Flannel CNI is already installed"
      when: flannel_check.rc == 0

    - name: Pause before checking Flannel pods
      ansible.builtin.pause:
        seconds: 5

    - name: Wait for Flannel pods to be ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=ready pod -l app=flannel -n kube-flannel --timeout=300s
      register: flannel_ready
      changed_when: false

    - name: Display Flannel status
      ansible.builtin.command:
        cmd: kubectl get pods -n kube-flannel
      register: flannel_status
      changed_when: false

    - name: Show Flannel pods
      ansible.builtin.debug:
        var: flannel_status.stdout_lines
